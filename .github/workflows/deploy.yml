# Индивидуальный проект: проверка + деплой
name: Check and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that index.html exists
        run: |
          test -f index.html && echo "index.html найден" || (echo "Нет index.html" && exit 1)
      - name: Check basic HTML structure
        run: |
          grep -qi "<!DOCTYPE html>" index.html && echo "DOCTYPE OK"
          grep -qi "<html" index.html && echo "html tag OK"
          grep -qi "</html>" index.html && echo "closing html OK"

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
